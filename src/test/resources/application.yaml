spring:
  application:
    name: account
  jpa:
    hibernate:
      # create-drop 유지 — 컨텍스트가 바뀔 때(@DataJpaTest <-> @SpringBootTest 등) 이전 컨텍스트가
      # 종료 시점에 스키마를 드롭해줘야 다음 컨텍스트가 빈 스키마로 시작한다. create로 바꿔봤다가
      # 드롭이 안 일어나 이전 테스트 데이터가 남아 제약조건 위반으로 실패하는 걸 확인해서 되돌림.
      # 컨테이너를 싱글턴으로 공유한 뒤로 컨텍스트 경계에서 서로 드롭이 겹쳐 FK drop ERROR 로그가
      # 남지만(HHH000478) 빌드엔 영향 없음 — 로그 노이즈보다 데이터 격리가 우선.
      ddl-auto: create-drop

jwt:
  secret: test-only-jwt-secret-key-not-for-production-32bytes-min
  expiration-ms: 3600000
# datasource/dialect는 일부러 안 씀:
# - Testcontainers 미사용 테스트 -> Spring Boot가 H2를 자동 감지해서 방언까지 맞춰줌
# - @ServiceConnection 쓰는 테스트 -> 컨테이너의 실제 MySQL 연결정보/방언을 그대로 사용
# 여기서 driver-class-name/database-platform을 고정하면 두 경우 다 깨짐
# (Testcontainers로 MySQL에 붙었는데 H2 방언으로 DDL을 만들어 보내는 문제 있었음)
# ddl-auto는 명시 안 하면 "임베디드 아닌 DB"로 보고 기본값이 none이 돼서 따로 남김
