spring:
  application:
    name: account
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
  flyway:
    enabled: true
    baseline-on-migrate: false
    clean-disabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
reconciliation:
  scheduler:
    enabled: false
ledger:
  simulated-deposits-enabled: true
jwt:
  secret: test-only-jwt-secret-key-not-for-production-32bytes-min
  expiration-ms: 3600000
rate-limit:
  general:
    capacity: 100000
    refill-tokens: 100000
    refill-period-seconds: 1
  login:
    capacity: 100000
    refill-tokens: 100000
    refill-period-seconds: 1
# MySQL and Redis endpoints are supplied exclusively by @ServiceConnection.
