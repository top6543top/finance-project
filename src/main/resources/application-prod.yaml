# Runtime uses a DML account. Migrate separately before starting this profile.
spring:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}
# Traefik이 X-Forwarded-For 끝에 실제 클라이언트 IP를 붙인다. Tomcat RemoteIpValve는 TCP 상대가
# TRUSTED_PROXIES(정규식)에 맞을 때만 이 헤더를 오른쪽부터 읽어 remoteAddr를 바꾼다 → 왼쪽 위조값은 무시.
# 기본값 없음: 누락 시 기동 실패로 바로 드러나게 한다 (R07 REDIS_HOST 교훈).
server:
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: ${TRUSTED_PROXIES}
ledger:
  simulated-deposits-enabled: false
app:
  security:
    public-docs: false
