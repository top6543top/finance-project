spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  application:
    name: account

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: false
    database-platform: org.hibernate.dialect.MySQLDialect

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

# health/prometheus만 노출 (env, beans 등은 계좌/잔고 설정값까지 흘릴 수 있어 기본 비공개)
# show-details: never — 미인증 헬스체크 응답에 DB 연결 정보 등 내부 구조가 드러나지 않도록
management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    org.hibernate.SQL: debug
    # org.hibernate.orm.jdbc.bind(Hibernate 6 바인드 파라미터 로거)는 절대 debug/trace로 켜지 말 것 —
    # 계좌번호/잔고가 마스킹 없이 그대로 찍혀 JSON 로그 파이프라인으로 나간다.
    # 마스킹은 TransactionService.mask()가 서비스 계층에서만 하고 있어 JDBC 바인드 로그는 우회한다.