spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  application:
    name: account

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: false
    database-platform: org.hibernate.dialect.MySQLDialect

  lifecycle:
    timeout-per-shutdown-phase: 20s

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# 토큰 버킷 방식 (IS-25) — capacity만큼 즉시 버스트를 허용하고, refill-period-seconds마다
# refill-tokens개씩 채워 평균 처리율을 제한. Fixed Window 대비 경계 순간 트래픽 몰림이 없고,
# Leaky Bucket 대비 순간 버스트를 허용해 정상 사용자 체감이 덜 끊긴다.
# login을 general과 분리한 이유: 로그인은 브루트포스 방지를 위해 훨씬 좁은 한도가 필요한데,
# 하나의 버킷을 같이 쓰면 그 좁은 한도에 정상 거래 트래픽까지 맞춰 막히게 된다.
rate-limit:
  general:
    capacity: ${RATE_LIMIT_CAPACITY:100}
    refill-tokens: ${RATE_LIMIT_REFILL_TOKENS:100}
    refill-period-seconds: ${RATE_LIMIT_REFILL_PERIOD_SECONDS:60}
  login:
    capacity: ${RATE_LIMIT_LOGIN_CAPACITY:10}
    refill-tokens: ${RATE_LIMIT_LOGIN_REFILL_TOKENS:10}
    refill-period-seconds: ${RATE_LIMIT_LOGIN_REFILL_PERIOD_SECONDS:60}

server:
  # SIGTERM 받아도 즉시 종료하지 않고, 처리 중인 요청을 끝낼 때까지 최대 20초 대기 (IS-34 무중단 배포)
  shutdown: graceful

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

# health/prometheus만 노출 (env, beans 등은 계좌/잔고 설정값까지 흘릴 수 있어 기본 비공개)
# show-details: never — 미인증 헬스체크 응답에 DB 연결 정보 등 내부 구조가 드러나지 않도록
# server.port(8080)와 분리 — SecurityConfig의 인증 필터체인이 이 포트엔 안 걸림.
# 대신 Service/Ingress로 9090을 외부에 안 열어서(클러스터 내부에서만 접근) 보호함 (IS-33)
management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    distribution:
      # histogram_quantile로 p99 계산하려면 _bucket 시계열이 있어야 함 (IS-33 Grafana p99 패널/알람 전제조건)
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    org.hibernate.SQL: debug
    # org.hibernate.orm.jdbc.bind(Hibernate 6 바인드 파라미터 로거)는 절대 debug/trace로 켜지 말 것 —
    # 계좌번호/잔고가 마스킹 없이 그대로 찍혀 JSON 로그 파이프라인으로 나간다.
    # 마스킹은 TransactionService.mask()가 서비스 계층에서만 하고 있어 JDBC 바인드 로그는 우회한다.