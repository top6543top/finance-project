spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  application:
    name: account

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

# health/prometheus만 노출 (env, beans 등은 계좌/잔고 설정값까지 흘릴 수 있어 기본 비공개)
# show-details: never — 미인증 헬스체크 응답에 DB 연결 정보 등 내부 구조가 드러나지 않도록
management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace