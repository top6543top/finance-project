apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: account-service
  strategy:
    rollingUpdate:
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: account-service
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: account-service
          image: 982248023836.dkr.ecr.ap-northeast-2.amazonaws.com/account-service:latest
          ports:
            - containerPort: 8080
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=60 -Xss512k"
          resources:
            requests:
              memory: "300Mi"
            limits:
              memory: "450Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
          envFrom:
            - secretRef:
                name: account-db-secret