apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: account-service
  strategy:
    rollingUpdate:
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: account-service
    spec:
      # preStop(5s) + graceful shutdown(20s)보다 넉넉하게 — 안 그러면 SIGKILL이 먼저 와서 graceful shutdown이 잘림
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: account-service
          image: 982248023836.dkr.ecr.ap-northeast-2.amazonaws.com/account-service:latest
          ports:
            - containerPort: 8080
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=60 -Xss512k"
          resources:
            requests:
              memory: "300Mi"
            limits:
              memory: "450Mi"
          lifecycle:
            preStop:
              # Pod 종료 시작 시점과 Service가 라우팅에서 빼는 시점 사이 시차를 메움 (IS-34)
              exec:
                command: ["sh", "-c", "sleep 5"]
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
          envFrom:
            - secretRef:
                name: account-db-secret