apiVersion: batch/v1
kind: Job
metadata:
  name: __MIGRATION_JOB_NAME__
  namespace: default
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ecr-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: __IMAGE__
          command: [java]
          args:
            - -Dloader.main=com.trading.account.common.config.DatabaseMigration
            - -cp
            - /app/app.jar
            - org.springframework.boot.loader.launch.PropertiesLauncher
            - migrate
          envFrom:
            - secretRef:
                name: account-migration-secret
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 384Mi
