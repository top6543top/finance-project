# k3s Traefik and Prometheus labels must be verified against the actual cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: account-service-ingress
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: account-service
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9090
