apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: account-service-alerts
  namespace: monitoring
  labels:
    # ServiceMonitor와 동일한 release 라벨 — Prometheus Operator의 ruleSelector가 이걸로 이 룰을 인식함
    release: monitoring
spec:
  groups:
    - name: account-service.rules
      rules:
        - alert: AccountLedgerMismatch
          expr: max(reconciliation_mismatches{job="account-service"}) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "원장과 잔액의 불일치가 발견됨"
            description: "대사 run과 reconciliation_mismatch를 조사하십시오. 자동 잔액 수정은 금지합니다."
        - alert: AccountReconciliationStale
          expr: time() - max(reconciliation_last_completed_timestamp{job="account-service"}) > 97200 or absent(reconciliation_last_completed_timestamp{job="account-service"})
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "최근 27시간 동안 완료된 대사가 없거나 지표가 없음"
            description: "스케줄러와 실행 상태를 확인하고 중단 실행은 운영 중지 절차 후 복구하십시오."
        - alert: AccountReconciliationFailure
          expr: max(delta(reconciliation_runs_failed{job="account-service"}[15m])) > 0 or sum(increase(reconciliation_launch_failures_total{job="account-service"}[15m])) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "대사 실행 또는 시작 실패"
            description: "최근 실패 run과 시작 오류를 확인하십시오."
        - alert: AccountServiceUnavailable
          expr: up{job="account-service"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "account-service 관측 대상에 연결할 수 없음"
            description: "앱, DB, Redis, 네트워크 및 readiness를 확인하십시오."
        - alert: AccountServiceHighErrorRate
          expr: >
            100 * sum(rate(http_server_requests_seconds_count{job="account-service",status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_server_requests_seconds_count{job="account-service"}[5m])), 1e-9)
            > 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "account-service 5xx 에러율 5% 초과"
            description: "최근 5분간 5xx 응답 비율이 {{ $value | printf \"%.1f\" }}% 입니다."

        - alert: AccountServiceHighP99Latency
          expr: >
            histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket{job="account-service"}[5m])) by (le))
            > 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "account-service p99 지연시간 1초 초과"
            description: "최근 5분간 p99 지연시간이 {{ $value | printf \"%.2f\" }}s 입니다."

        - alert: AccountServicePodRestarting
          expr: >
            increase(kube_pod_container_status_restarts_total{namespace="default", pod=~"account-service-.*"}[15m])
            > 0
          labels:
            severity: warning
          annotations:
            summary: "account-service 파드가 재시작됨"
            description: "{{ $labels.pod }} 파드가 최근 15분 내 {{ $value }}회 재시작했습니다. (정상 롤링 배포는 재시작 카운트를 올리지 않음 — crash/OOMKill 의심)"
