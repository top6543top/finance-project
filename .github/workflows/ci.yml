name: CI Pipeline
on:
  pull_request:
    branches: [master]
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle
      - name: Test MySQL, Redis and release rendering
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon
          python3 scripts/test_render_manifests.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.sha }}
          path: build/reports/tests/test
